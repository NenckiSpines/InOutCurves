[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inoutcurves-research"
version = "2.0.0"
description = "Subject-level permutation inference for electrophysiological input-output curves"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6"]

[tool.setuptools]
packages = ["scripts", "analysis", "examples"]
